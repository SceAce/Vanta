[project]
name = "vanta-tools"
version = "0.0.0"
description = "Tooling, hooks, and support scripts for Vanta"
readme = "tools/README.md"
requires-python = ">=3.13"
authors = [{ name = "Cubeyond" }]
license = { text = "Apache-2.0" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["tools/trellis-tools/src"]
testpaths = ["tools/trellis-tools/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
strict = true
mypy_path = ["tools/trellis-tools/src"]
